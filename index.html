<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晚餐助手">
<meta name="theme-color" content="#c17d3c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>晚餐助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --border: #e8e4dc;
  --border-hover: #c8c3b8;
  --text-primary: #1a1814;
  --text-secondary: #6b6760;
  --text-muted: #9e9a94;
  --accent: #c17d3c;
  --accent-light: #f5ede0;
  --accent-dark: #8f5a28;
  --green-bg: #edf5ec;
  --green-text: #2a6b38;
  --amber-bg: #fdf3e3;
  --amber-text: #8f5a28;
  --blue-bg: #edf4fb;
  --blue-text: #1e5f9e;
  --purple-bg: #f0eefb;
  --purple-text: #4a3b9e;
  --red-bg: #fdf0f0;
  --red-text: #9e2a2a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text-primary); padding-bottom: calc(60px + var(--safe-bottom)); }

/* Header */
.page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(12px + var(--safe-top)) 16px 0; position: sticky; top: 0; z-index: 20; }
.page-header h1 { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 600; padding-bottom: 12px; }

/* Tab bar */
.tab-bar { display: flex; border-bottom: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 10px 0; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; background: none; border: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* Pages */
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* Day strip */
.day-strip { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 16px; }
.day-strip::-webkit-scrollbar { display: none; }
.day-btn { padding: 6px 16px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text-secondary); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }

/* Menu grid */
.menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.dish-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; cursor: pointer; position: relative; min-height: 95px; display: flex; flex-direction: column; gap: 5px; }
.dish-card:active { opacity: 0.8; }
.dish-card.active { border: 2px solid var(--accent); background: #fffaf5; }
.dish-tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; align-self: flex-start; }
.tag-meat { background: #fdeee6; color: #993C1D; }
.tag-veg { background: var(--green-bg); color: var(--green-text); }
.tag-soup { background: var(--blue-bg); color: var(--blue-text); }
.tag-egg { background: var(--amber-bg); color: var(--amber-text); }
.dish-name { font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1.4; }
.dish-time { font-size: 11px; color: var(--text-muted); margin-top: auto; }
.edit-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px 6px; cursor: pointer; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; margin-bottom: 14px; display: none; }
.panel.show { display: block; }
.panel-label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px; }
.panel-label span { font-size: 12px; color: var(--text-muted); font-weight: 400; }

/* Inputs */
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row input, .big-input { width: 100%; padding: 10px 12px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); color: var(--text-primary); outline: none; -webkit-appearance: none; }
.input-row input:focus, .big-input:focus { border-color: var(--accent); }
.big-input { min-height: 100px; resize: none; line-height: 1.6; }

/* Buttons */
.btn-accent { padding: 10px 16px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; font-weight: 500; background: var(--accent); color: #fff; border: none; border-radius: var(--r-md); cursor: pointer; display: flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap; }
.btn-accent:disabled { opacity: 0.5; }
.btn-accent.full { width: 100%; margin-top: 10px; padding: 12px; font-size: 14px; }
.btn-outline { padding: 8px 14px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; background: none; border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text-secondary); cursor: pointer; }

.spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
.spinner.show { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Detail panel */
.detail-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.detail-title { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 600; flex: 1; }
.detail-time { font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); }
.ai-badge { font-size: 10px; background: var(--purple-bg); color: var(--purple-text); padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.section-label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; margin-top: 14px; }
.section-label:first-child { margin-top: 0; }
.ing-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.ing-row:last-child { border-bottom: none; }
.ing-amt { color: var(--text-secondary); }
.steps-list { list-style: none; }
.steps-list li { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
.step-num { min-width: 20px; height: 20px; background: var(--accent-light); color: var(--accent-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; margin-top: 2px; flex-shrink: 0; }

/* Shopping */
.shopping-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; margin-bottom: 14px; }
.shopping-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
.shopping-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.shop-item { display: flex; justify-content: space-between; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px; }
.shop-item span:last-child { color: var(--text-secondary); }

/* Error */
.err-msg { font-size: 12px; color: var(--red-text); background: var(--red-bg); padding: 8px 12px; border-radius: var(--r-md); margin-top: 8px; display: none; }
.err-msg.show { display: block; }
.clear-link { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.clear-link a { color: var(--accent); text-decoration: underline; cursor: pointer; }

/* Fridge result */
.fridge-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; margin-top: 14px; display: none; }
.fridge-result.show { display: block; }
.fridge-result-content { font-size: 13px; line-height: 1.8; color: var(--text-primary); white-space: pre-wrap; }
.fridge-dish-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px; margin-bottom: 10px; cursor: pointer; }
.fridge-dish-card:active { opacity: 0.8; }
.fridge-dish-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.fridge-dish-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.fridge-dish-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-bottom: 6px; background: var(--green-bg); color: var(--green-text); font-weight: 500; }

.footer-note { font-size: 11px; color: var(--text-muted); padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); line-height: 1.6; }

/* Loading overlay */
.loading-overlay { position: fixed; inset: 0; background: rgba(250,249,246,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
.loading-overlay.show { display: flex; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
.loading-text { font-size: 14px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="page-header">
  <h1>晚餐助手</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('menu')">本週菜單</button>
    <button class="tab-btn" onclick="switchTab('fridge')">冰箱食材</button>
  </div>
</div>

<!-- 本週菜單 -->
<div class="page active" id="page-menu">
  <div class="day-strip" id="dayStrip"></div>
  <div class="menu-grid" id="menuGrid"></div>
  <div class="panel" id="customPanel"></div>
  <div class="panel" id="detailPanel"></div>
  <div class="shopping-card" id="shoppingCard" style="display:none;"></div>
  <div class="footer-note">食材份量已依家庭人數調整。點選菜色卡片查看食譜，右上角「自訂」可更換菜色。</div>
</div>

<!-- 冰箱食材 -->
<div class="page" id="page-fridge">
  <div class="panel show">
    <div class="panel-label">冰箱有什麼？<span>輸入食材，幫你想菜色</span></div>
    <textarea class="big-input" id="fridgeInput" placeholder="例如：豬肉、豆腐、青江菜、雞蛋、番茄、洋蔥…&#10;&#10;不用格式，隨便打就好！"></textarea>
    <button class="btn-accent full" id="fridgeBtn" onclick="analyzeFridge()">
      <div class="spinner" id="fridgeSpinner"></div>
      <span id="fridgeBtnText">幫我想菜色</span>
    </button>
    <div class="err-msg" id="fridgeErr"></div>
  </div>
  <div class="fridge-result" id="fridgeResult"></div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">生成中...</div>
</div>

<script>
const WORKER_URL = 'https://dinner.pon76124.workers.dev';
const SCALE = 3.0;
const SLOT_LABELS = ['肉類','蔬菜','蛋類/豆腐','湯品'];
const SLOT_TAG_NAMES = ['肉類','蔬菜','蛋類','湯品'];
const SLOT_TAGS = ['tag-meat','tag-veg','tag-egg','tag-soup'];

const MENUS = [
  { day:'週一', dishes:[
    { id:'pork_ginger', name:'薑絲炒肉絲', tag:'肉類', tagClass:'tag-meat', time:'約 20 分鐘',
      ingredients:[{name:'豬肉絲',unit:'g',base:150},{name:'薑絲',unit:'g',base:20},{name:'醬油',unit:'cc',base:15},{name:'米酒',unit:'cc',base:10},{name:'太白粉',unit:'g',base:5},{name:'沙拉油',unit:'cc',base:15},{name:'鹽',unit:'g',base:2}],
      steps:['豬肉絲加醬油、米酒、太白粉醃 10 分鐘。','起鍋熱油，先爆香薑絲至微焦香。','放入醃好的肉絲，大火快炒至變色。','加鹽調味，翻炒均勻即可起鍋。']},
    { id:'spinach', name:'蒜炒菠菜', tag:'蔬菜', tagClass:'tag-veg', time:'約 10 分鐘',
      ingredients:[{name:'菠菜',unit:'g',base:300},{name:'蒜末',unit:'g',base:10},{name:'沙拉油',unit:'cc',base:15},{name:'鹽',unit:'g',base:3}],
      steps:['菠菜洗淨切段，備用。','起鍋熱油，爆香蒜末至微黃。','放入菠菜大火翻炒約 2 分鐘。','加鹽調味，快速翻炒後起鍋。']},
    { id:'egg_tomato', name:'番茄炒蛋', tag:'蛋類', tagClass:'tag-egg', time:'約 15 分鐘',
      ingredients:[{name:'雞蛋',unit:'顆',base:3,noScale:true},{name:'番茄',unit:'g',base:250},{name:'糖',unit:'g',base:5},{name:'鹽',unit:'g',base:3},{name:'沙拉油',unit:'cc',base:20}],
      steps:['雞蛋打散加少許鹽，番茄切塊。','熱鍋下油，炒蛋至半熟後盛起。','同鍋再加油，放番茄炒出湯汁。','加糖、鹽，倒回蛋翻炒均勻。']},
    { id:'seaweed_soup', name:'海帶芽蛋花湯', tag:'湯品', tagClass:'tag-soup', time:'約 15 分鐘',
      ingredients:[{name:'乾海帶芽',unit:'g',base:10},{name:'雞蛋',unit:'顆',base:1,noScale:true},{name:'薑片',unit:'g',base:5},{name:'鹽',unit:'g',base:3},{name:'香油',unit:'cc',base:5},{name:'水',unit:'cc',base:800}],
      steps:['乾海帶芽泡水 5 分鐘後瀝乾。','鍋中水燒開，放薑片與海帶芽煮 5 分鐘。','雞蛋打散，沿鍋邊慢慢倒入做蛋花。','加鹽調味，起鍋前滴幾滴香油。']}
  ]},
  { day:'週二', dishes:[
    { id:'onion_pork', name:'洋蔥炒豬排', tag:'肉類', tagClass:'tag-meat', time:'約 20 分鐘',
      ingredients:[{name:'薄切豬排',unit:'g',base:300},{name:'洋蔥',unit:'g',base:150},{name:'醬油',unit:'cc',base:20},{name:'味醂',unit:'cc',base:10},{name:'糖',unit:'g',base:5},{name:'沙拉油',unit:'cc',base:15}],
      steps:['豬排用醬油、味醂、糖醃 10 分鐘。','洋蔥切絲，熱油先炒至半透明。','放入豬排大火煎至兩面金黃。','倒入剩餘醃料炒勻，燒至收汁。']},
    { id:'cabbage', name:'手撕高麗菜', tag:'蔬菜', tagClass:'tag-veg', time:'約 10 分鐘',
      ingredients:[{name:'高麗菜',unit:'g',base:350},{name:'蒜末',unit:'g',base:10},{name:'辣椒',unit:'根',base:1,noScale:true},{name:'鹽',unit:'g',base:3},{name:'醬油',unit:'cc',base:10},{name:'沙拉油',unit:'cc',base:15}],
      steps:['高麗菜用手撕成大片，洗淨備用。','起鍋熱油，爆香蒜末與辣椒段。','放入高麗菜大火翻炒至葉片軟化。','加鹽、醬油調味，快炒後起鍋。']},
    { id:'steamed_egg', name:'蒸蛋', tag:'蛋類', tagClass:'tag-egg', time:'約 20 分鐘',
      ingredients:[{name:'雞蛋',unit:'顆',base:3,noScale:true},{name:'高湯或水',unit:'cc',base:300},{name:'醬油',unit:'cc',base:15},{name:'香油',unit:'cc',base:5},{name:'鹽',unit:'g',base:2}],
      steps:['雞蛋打散，加高湯（蛋液：高湯 = 1：1.5）。','加鹽攪拌均勻，過篩去泡沫。','蓋上保鮮膜，電鍋外鍋放半杯水蒸。','蒸熟後淋醬油與香油即可。']},
    { id:'miso_soup', name:'味噌豆腐湯', tag:'湯品', tagClass:'tag-soup', time:'約 15 分鐘',
      ingredients:[{name:'嫩豆腐',unit:'g',base:200},{name:'味噌',unit:'g',base:30},{name:'蔥花',unit:'g',base:10},{name:'柴魚昆布高湯',unit:'cc',base:800}],
      steps:['高湯煮滾，豆腐切丁放入。','小火煮 3 分鐘後關火。','味噌用少量湯溶開後倒入鍋中，勿再開火。','撒上蔥花即可盛碗。']}
  ]},
  { day:'週三', dishes:[
    { id:'three_cup', name:'三杯雞', tag:'肉類', tagClass:'tag-meat', time:'約 25 分鐘',
      ingredients:[{name:'雞腿肉',unit:'g',base:400},{name:'九層塔',unit:'g',base:15},{name:'薑片',unit:'g',base:15},{name:'蒜頭',unit:'g',base:20},{name:'醬油',unit:'cc',base:30},{name:'米酒',unit:'cc',base:30},{name:'麻油',unit:'cc',base:20},{name:'糖',unit:'g',base:10}],
      steps:['雞腿肉切塊，麻油入鍋爆香薑片至微焦。','加蒜頭炒香，放雞肉大火翻炒至表面上色。','加醬油、米酒、糖，蓋鍋小火燜煮 10 分鐘。','開大火收汁，起鍋前放九層塔翻炒均勻。']},
    { id:'hollow_veg', name:'清炒空心菜', tag:'蔬菜', tagClass:'tag-veg', time:'約 10 分鐘',
      ingredients:[{name:'空心菜',unit:'g',base:300},{name:'蒜末',unit:'g',base:10},{name:'鹽',unit:'g',base:3},{name:'沙拉油',unit:'cc',base:15}],
      steps:['空心菜摘洗乾淨，切段。','起鍋熱油，爆香蒜末。','大火放入空心菜快速翻炒。','加鹽調味，炒至葉片軟化即可。']},
    { id:'tofu_pork', name:'豆腐燒肉末', tag:'蛋類', tagClass:'tag-egg', time:'約 15 分鐘',
      ingredients:[{name:'板豆腐',unit:'g',base:300},{name:'豬絞肉',unit:'g',base:100},{name:'醬油',unit:'cc',base:20},{name:'蔥花',unit:'g',base:10},{name:'糖',unit:'g',base:5},{name:'沙拉油',unit:'cc',base:15}],
      steps:['豆腐切大塊，廚房紙巾稍微吸乾水分。','熱鍋下油，豆腐煎至兩面金黃後撥到一旁。','放入絞肉炒熟，加醬油、糖翻炒均勻。','加少許水燒至入味，起鍋撒蔥花。']},
    { id:'winter_melon', name:'冬瓜排骨湯', tag:'湯品', tagClass:'tag-soup', time:'約 45 分鐘',
      ingredients:[{name:'豬排骨',unit:'g',base:300},{name:'冬瓜',unit:'g',base:400},{name:'薑片',unit:'g',base:10},{name:'鹽',unit:'g',base:5},{name:'水',unit:'cc',base:1200}],
      steps:['排骨汆燙去血水後洗淨。','冬瓜去皮切大塊。','所有材料放入電鍋，外鍋放 1.5 杯水蒸煮。','起鍋前加鹽調味即可。']}
  ]},
  { day:'週四', dishes:[
    { id:'steam_fish', name:'清蒸魚', tag:'肉類', tagClass:'tag-meat', time:'約 20 分鐘',

      steps:['排骨汆燙後洗淨，玉米切段，紅蘿蔔滾刀切塊。','所有材料加水放電鍋，外鍋 1.5 杯水。','電鍋跳起後悶 10 分鐘。','加鹽調味即可。']}

// State
let currentDayIdx = 0;
let activeDishId = null;
let customDishes = {};

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['menu','fridge'][i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
}

// Days
function renderDays() {
  document.getElementById('dayStrip').innerHTML = MENUS.map((m,i) =>
    `<button class="day-btn${i===currentDayIdx?' active':''}" onclick="setDay(${i})">${m.day}</button>`
  ).join('');
}

function setDay(idx) {
  currentDayIdx = idx;
  activeDishId = null;
  document.getElementById('customPanel').className = 'panel';
  document.getElementById('detailPanel').className = 'panel';
  renderDays();
  renderMenu();
}

function getEffectiveDishes() {
  return MENUS[currentDayIdx].dishes.map((d,i) => customDishes[`${currentDayIdx}_${i}`] || d);
}

function renderMenu() {
  const dishes = getEffectiveDishes();
  document.getElementById('menuGrid').innerHTML = dishes.map((d,i) => {
    const isCustom = !!customDishes[`${currentDayIdx}_${i}`];
    const isActive = activeDishId === d.id;
    return `<div class="dish-card${isActive?' active':''}${isCustom?' has-custom':''}" onclick="showDish('${d.id}',${i})">
      <div class="dish-tag ${d.tagClass}">${d.tag}</div>
      <div class="dish-name">${d.name}</div>
      <div class="dish-time">${d.time}</div>
      <span class="edit-badge" onclick="openCustom(event,${i})">${isCustom?'修改':'自訂'}</span>
    </div>`;
  }).join('');
  renderShopping();
}

function openCustom(e, slotIdx) {
  e.stopPropagation();
  activeDishId = null;
  document.getElementById('detailPanel').className = 'panel';
  const key = `${currentDayIdx}_${slotIdx}`;
  const existing = customDishes[key];
  const panel = document.getElementById('customPanel');
  panel.innerHTML = `
    <div class="panel-label">自訂「${SLOT_LABELS[slotIdx]}」<span>輸入菜名，由 AI 生成食譜</span></div>
    <div class="input-row">
      <input id="nameInput" type="text" placeholder="例如：蒜泥白肉、菜脯蛋…"
        value="${existing?existing.name:''}" onkeydown="if(event.key==='Enter')doGenerate(${slotIdx})"/>
      <button class="btn-accent" id="genBtn" onclick="doGenerate(${slotIdx})">
        <div class="spinner" id="genSpinner"></div>
        <span id="genTxt">生成</span>
      </button>
    </div>
    <div class="err-msg" id="genErr"></div>
    ${existing?`<div class="clear-link">目前：<strong>${existing.name}</strong>　<a onclick="clearCustom(${slotIdx})">恢復預設</a></div>`:''}
  `;
  panel.className = 'panel show';
  setTimeout(()=>{ const el=document.getElementById('nameInput'); if(el) el.focus(); },100);
}

function clearCustom(slotIdx) {
  delete customDishes[`${currentDayIdx}_${slotIdx}`];
  document.getElementById('customPanel').className = 'panel';
  activeDishId = null;
  document.getElementById('detailPanel').className = 'panel';
  renderMenu();
}

async function callClaude(prompt) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(`API ${res.status}`);
  return data.content.map(c => c.text||'').join('').trim();
}

async function doGenerate(slotIdx) {
  const name = (document.getElementById('nameInput').value||'').trim();
  if (!name) { document.getElementById('nameInput').focus(); return; }
  const btn = document.getElementById('genBtn');
  const sp = document.getElementById('genSpinner');
  const txt = document.getElementById('genTxt');
  const err = document.getElementById('genErr');
  btn.disabled = true; sp.className = 'spinner show'; txt.textContent = '生成中…'; err.className = 'err-msg';

  const prompt = `你是台灣家庭料理專家。請為「${name}」生成一份適合一家五口（3個成人份）的食譜。
只回傳 JSON，格式如下，不要任何其他文字：
{"name":"${name}","tag":"${SLOT_TAG_NAMES[slotIdx]}","time":"約 X 分鐘","ingredients":[{"name":"食材","unit":"g或cc或顆","amount":數字}],"steps":["步驟1","步驟2","步驟3","步驟4"]}
規則：台灣菜市場容易買到的食材，備餐加烹飪在60分鐘內，份量已是3人份。`;

  try {
    const raw = await callClaude(prompt);
    const clean = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const jsonMatch = clean.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('格式錯誤');
    const r = JSON.parse(jsonMatch[0]);
    const tagMap = {'肉類':'tag-meat','蔬菜':'tag-veg','蛋類':'tag-egg','湯品':'tag-soup'};
    const dish = {
      id: `custom_${currentDayIdx}_${slotIdx}_${Date.now()}`,
      name: r.name, tag: r.tag||SLOT_TAG_NAMES[slotIdx],
      tagClass: tagMap[r.tag]||SLOT_TAGS[slotIdx],
      time: r.time||'約 20 分鐘',
      ingredients: r.ingredients.map(i=>({name:i.name,unit:i.unit,base:i.amount,noScale:true})),
      steps: r.steps, isAI: true
    };
    customDishes[`${currentDayIdx}_${slotIdx}`] = dish;
    document.getElementById('customPanel').className = 'panel';
    activeDishId = dish.id;
    renderMenu();
    renderDetail(dish);
  } catch(e) {
    err.textContent = '生成失敗，請再試一次。（'+e.message+'）';
    err.className = 'err-msg show';
  } finally {
    btn.disabled = false; sp.className = 'spinner'; txt.textContent = '生成';
  }
}

function showDish(dishId, slotIdx) {
  document.getElementById('customPanel').className = 'panel';
  if (activeDishId === dishId) {
    activeDishId = null;
    document.getElementById('detailPanel').className = 'panel';
    renderMenu(); return;
  }
  activeDishId = dishId;
  const dish = getEffectiveDishes()[slotIdx];
  renderMenu();
  renderDetail(dish);
  setTimeout(() => document.getElementById('detailPanel').scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
}

function renderDetail(dish) {
  const panel = document.getElementById('detailPanel');
  if (!dish) { panel.className='panel'; return; }
  const ings = dish.ingredients.map(ing => {
    const amt = ing.noScale ? ing.base : Math.round(ing.base * SCALE);
    return `<div class="ing-row"><span>${ing.name}</span><span class="ing-amt">${amt} ${ing.unit}</span></div>`;
  }).join('');
  const steps = dish.steps.map((s,i) =>
    `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`
  ).join('');
  const aiBadge = dish.isAI ? `<span class="ai-badge">AI 生成</span>` : '';
  panel.className = 'panel show';
  panel.innerHTML = `
    <div class="detail-header">
      <span class="detail-title">${dish.name}</span>
      ${aiBadge}
      <span class="detail-time">${dish.time}</span>
    </div>
    <div class="section-label">備料清單（5 人份）</div>
    ${ings}
    <div class="section-label">烹飪步驟</div>
    <ul class="steps-list">${steps}</ul>`;
}

function renderShopping() {
  const card = document.getElementById('shoppingCard');
  const allIng = {};
  getEffectiveDishes().forEach(dish => {
    dish.ingredients.forEach(ing => {
      const amt = ing.noScale ? ing.base : Math.round(ing.base * SCALE);
      if (allIng[ing.name]) { if (!ing.noScale) allIng[ing.name].amt += amt; }
      else allIng[ing.name] = { amt, unit: ing.unit };
    });
  });
  card.style.display = 'block';
  card.innerHTML = `
    <div class="shopping-title">今日採買清單</div>
    <div class="shopping-grid">
      ${Object.entries(allIng).map(([n,v]) =>
        `<div class="shop-item"><span>${n}</span><span>${v.amt} ${v.unit}</span></div>`
      ).join('')}
    </div>`;
}

// Fridge feature
async function analyzeFridge() {
  const input = document.getElementById('fridgeInput').value.trim();
  if (!input) { document.getElementById('fridgeInput').focus(); return; }

  const btn = document.getElementById('fridgeBtn');
  const sp = document.getElementById('fridgeSpinner');
  const txt = document.getElementById('fridgeBtnText');
  const err = document.getElementById('fridgeErr');
  const result = document.getElementById('fridgeResult');

  btn.disabled = true; sp.className = 'spinner show'; txt.textContent = '分析中…';
  err.className = 'err-msg'; result.className = 'fridge-result';

  const prompt = `你是台灣家庭料理專家。根據以下冰箱食材，為一家五口推薦 3-4 道適合今晚做的菜（包含一道湯）。

冰箱食材：${input}

請回傳 JSON 格式，不要其他文字：
{"dishes":[{"name":"菜名","description":"簡短說明用了哪些食材，口味如何","missing":"還需要買什麼（若不需要則填空字串）","tag":"肉類或蔬菜或蛋類或湯品"}]}

要求：優先使用冰箱既有食材，不足的食材盡量少，適合台灣家常口味，60分鐘內可完成。`;

  try {
    const raw = await callClaude(prompt);
    const clean = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const jsonMatch = clean.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('格式錯誤');
    const data = JSON.parse(jsonMatch[0]);
    const tagMap = {'肉類':'tag-meat','蔬菜':'tag-veg','蛋類':'tag-egg','湯品':'tag-soup'};

    result.className = 'fridge-result show';
    result.innerHTML = `
      <div class="panel-label" style="margin-bottom:12px;">根據你的食材，推薦這幾道：</div>
      ${data.dishes.map(d => `
        <div class="fridge-dish-card" onclick="getFridgeRecipe('${d.name.replace(/'/g,"\\'")}')">
          <div class="fridge-dish-badge">${d.tag}</div>
          <div class="fridge-dish-name">${d.name}</div>
          <div class="fridge-dish-desc">${d.description}</div>
          ${d.missing ? `<div style="font-size:11px;color:var(--accent);margin-top:6px;">需補買：${d.missing}</div>` : ''}
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">點擊查看完整食譜 →</div>
        </div>
      `).join('')}
    `;
  } catch(e) {
    err.textContent = '分析失敗，請再試一次。（'+e.message+'）';
    err.className = 'err-msg show';
  } finally {
    btn.disabled = false; sp.className = 'spinner'; txt.textContent = '幫我想菜色';
  }
}

async function getFridgeRecipe(dishName) {
  const overlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  overlay.className = 'loading-overlay show';
  loadingText.textContent = `生成「${dishName}」食譜中…`;

  const prompt = `你是台灣家庭料理專家。請為「${dishName}」生成一份適合一家五口（3個成人份）的詳細食譜。
只回傳 JSON，不要其他文字：
{"name":"${dishName}","tag":"肉類或蔬菜或蛋類或湯品","time":"約 X 分鐘","ingredients":[{"name":"食材","unit":"g或cc或顆","amount":數字}],"steps":["步驟1","步驟2","步驟3","步驟4"]}`;

  try {
    const raw = await callClaude(prompt);
    const clean = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const jsonMatch = clean.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('格式錯誤');
    const r = JSON.parse(jsonMatch[0]);
    const tagMap = {'肉類':'tag-meat','蔬菜':'tag-veg','蛋類':'tag-egg','湯品':'tag-soup'};
    const dish = {
      id: `fridge_${Date.now()}`,
      name: r.name, tag: r.tag,
      tagClass: tagMap[r.tag]||'tag-meat',
      time: r.time||'約 20 分鐘',
      ingredients: r.ingredients.map(i=>({name:i.name,unit:i.unit,base:i.amount,noScale:true})),
      steps: r.steps, isAI: true
    };
    overlay.className = 'loading-overlay';
    showFridgeRecipeModal(dish);
  } catch(e) {
    overlay.className = 'loading-overlay';
    alert('食譜生成失敗：' + e.message);
  }
}

function showFridgeRecipeModal(dish) {
  const result = document.getElementById('fridgeResult');
  const ings = dish.ingredients.map(ing =>
    `<div class="ing-row"><span>${ing.name}</span><span class="ing-amt">${ing.base} ${ing.unit}</span></div>`
  ).join('');
  const steps = dish.steps.map((s,i) =>
    `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`
  ).join('');

  const recipeDiv = document.createElement('div');
  recipeDiv.className = 'panel show';
  recipeDiv.style.marginTop = '14px';
  recipeDiv.innerHTML = `
    <div class="detail-header">
      <span class="detail-title">${dish.name}</span>
      <span class="ai-badge">AI 生成</span>
      <span class="detail-time">${dish.time}</span>
    </div>
    <div class="section-label">備料清單（5 人份）</div>
    ${ings}
    <div class="section-label">烹飪步驟</div>
    <ul class="steps-list">${steps}</ul>
    <button class="btn-outline" style="margin-top:12px;width:100%;" onclick="this.parentElement.remove()">收起食譜</button>
  `;
  result.appendChild(recipeDiv);
  setTimeout(() => recipeDiv.scrollIntoView({behavior:'smooth',block:'start'}), 100);
}

// Init
renderDays();
renderMenu();
</script>
