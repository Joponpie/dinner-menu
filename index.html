<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晚餐菜單">
<meta name="theme-color" content="#c17d3c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>晚餐菜單產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --border: #e8e4dc;
    --border-hover: #c8c3b8;
    --text-primary: #1a1814;
    --text-secondary: #6b6760;
    --text-muted: #9e9a94;
    --accent: #c17d3c;
    --accent-light: #f5ede0;
    --accent-dark: #8f5a28;
    --green-bg: #edf5ec;
    --green-text: #2a6b38;
    --amber-bg: #fdf3e3;
    --amber-text: #8f5a28;
    --blue-bg: #edf4fb;
    --blue-text: #1e5f9e;
    --purple-bg: #f0eefb;
    --purple-text: #4a3b9e;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: calc(16px + var(--safe-bottom));
  }

  /* Install banner */
  .install-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--accent);
    color: #fff;
    padding: 12px 16px;
    font-size: 13px;
  }
  .install-banner.show { display: flex; }
  .install-banner-text { flex: 1; line-height: 1.4; }
  .install-banner-text strong { display: block; font-weight: 500; }
  .install-banner-text span { opacity: 0.85; font-size: 12px; }
  .install-btn {
    background: #fff;
    color: var(--accent-dark);
    border: none;
    border-radius: var(--radius-md);
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .install-dismiss {
    background: none; border: none; color: rgba(255,255,255,0.7);
    font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;
  }

  /* iOS install hint */
  .ios-hint {
    display: none;
    background: #1a1814;
    color: #fff;
    font-size: 13px;
    padding: 12px 16px;
    text-align: center;
    line-height: 1.6;
  }
  .ios-hint.show { display: block; }

  .page-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + var(--safe-top)) 16px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .page-header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .page-header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .day-strip {
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn {
    padding: 6px 16px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .day-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }

  .container { padding: 16px; }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .dish-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
    cursor: pointer;
    position: relative;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: border-color 0.15s;
    -webkit-user-select: none;
  }
  .dish-card:active { opacity: 0.85; }
  .dish-card.active { border: 2px solid var(--accent); background: #fffaf5; }
  .dish-card.custom-card.has-custom { border-style: solid; }

  .dish-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    align-self: flex-start;
  }
  .tag-meat { background: #fdeee6; color: #993C1D; }
  .tag-veg  { background: var(--green-bg); color: var(--green-text); }
  .tag-soup { background: var(--blue-bg); color: var(--blue-text); }
  .tag-egg  { background: var(--amber-bg); color: var(--amber-text); }
  .tag-custom { background: var(--purple-bg); color: var(--purple-text); }

  .dish-name { font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1.4; }
  .dish-time { font-size: 11px; color: var(--text-muted); margin-top: auto; }

  .edit-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 10px; color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px 6px;
    cursor: pointer;
  }

  .custom-input-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 14px;
    display: none;
  }
  .custom-input-panel.show { display: block; }

  .panel-label {
    font-size: 13px; font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 10px;
  }
  .panel-label span { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .input-row {
    display: flex; gap: 8px; align-items: center;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    -webkit-appearance: none;
  }
  .input-row input:focus { border-color: var(--accent); }

  .generate-btn {
    padding: 10px 16px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    min-width: 80px; justify-content: center;
  }
  .generate-btn:disabled { opacity: 0.5; }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    font-size: 12px; color: #a32d2d;
    background: #fcebeb;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    margin-top: 8px;
    display: none;
  }
  .error-msg.show { display: block; }

  .clear-link {
    font-size: 12px; color: var(--text-muted);
    margin-top: 8px;
  }
  .clear-link a { color: var(--accent); text-decoration: underline; cursor: pointer; }

  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 14px;
    display: none;
  }
  .detail-panel.show { display: block; }

  .detail-header {
    display: flex; flex-wrap: wrap;
    align-items: center; gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .detail-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px; font-weight: 600;
    color: var(--text-primary);
    flex: 1;
  }
  .detail-time {
    font-size: 11px; color: var(--text-muted);
    background: var(--bg);
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .ai-badge {
    font-size: 10px;
    background: var(--purple-bg); color: var(--purple-text);
    padding: 2px 8px; border-radius: 20px; font-weight: 500;
  }

  .section-label {
    font-size: 10px; font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .ing-row {
    display: flex; justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .ing-row:last-child { border-bottom: none; }
  .ing-name { color: var(--text-primary); }
  .ing-amt { color: var(--text-secondary); }

  .steps-label { margin-top: 14px; }
  .steps-list { list-style: none; margin-top: 8px; }
  .steps-list li {
    display: flex; gap: 8px;
    font-size: 13px; color: var(--text-primary);
    line-height: 1.6; margin-bottom: 8px;
  }
  .step-num {
    min-width: 20px; height: 20px;
    background: var(--accent-light);
    color: var(--accent-dark);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    margin-top: 2px; flex-shrink: 0;
  }

  .shopping-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 14px;
  }
  .shopping-title {
    font-size: 13px; font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 10px;
  }
  .shopping-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .shop-item {
    display: flex; justify-content: space-between;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
  }
  .shop-item span:last-child { color: var(--text-secondary); }

  .footer-note {
    font-size: 11px; color: var(--text-muted);
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    line-height: 1.6;
  }
</style>
</head>
<body>

<!-- Android install banner -->
<div class="install-banner" id="installBanner">
  <div class="install-banner-text">
    <strong>加入手機主畫面</strong>
    <span>像 App 一樣隨時開啟</span>
  </div>
  <button class="install-btn" id="installBtn">安裝</button>
  <button class="install-dismiss" id="installDismiss">✕</button>
</div>

<!-- iOS hint -->
<div class="ios-hint" id="iosHint">
  點下方工具列的「分享」按鈕，再選「加入主畫面」即可安裝
</div>

<div class="page-header">
  <h1>晚餐菜單產生器</h1>
  <p>一家五口 · 三菜一湯 · 60 分鐘上菜</p>
</div>

<div class="day-strip" id="dayStrip"></div>

<div class="container">
  <div class="menu-grid" id="menuGrid"></div>
  <div class="custom-input-panel" id="customPanel"></div>
  <div class="detail-panel" id="detailPanel"></div>
  <div class="shopping-card" id="shoppingCard" style="display:none;"></div>
  <div class="footer-note" id="footerNote" style="display:none;">
    食材份量已依家庭人數調整（老大約等於大人食量，老二老三各半份）。點選菜色卡片可查看詳細食譜。
  </div>
</div>

<script>
// ── PWA install ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

document.getElementById('installDismiss').addEventListener('click', () => {
  document.getElementById('installBanner').classList.remove('show');
});

// iOS detect
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true;
if (isIOS && !isStandalone) {
  document.getElementById('iosHint').classList.add('show');
  setTimeout(() => document.getElementById('iosHint').classList.remove('show'), 8000);
}

// ── App data ─────────────────────────────────────────────────
const SCALE = 3.0;
const SLOT_LABELS = ['肉類', '蔬菜', '蛋類/豆腐', '湯品'];

const SLOT_TAGS = ['tag-meat','tag-veg','tag-egg','tag-soup'];

const MENUS = [
  { day:'週一', dishes:[
    { id:'pork_ginger', name:'薑絲炒肉絲', tag:'肉類', tagClass:'tag-meat', time:'約 20 分鐘',
      ingredients:[{name:'豬肉絲',unit:'g',base:150},{name:'薑絲',unit:'g',base:20},{name:'醬油',unit:'cc',base:15},{name:'米酒',unit:'cc',base:10},{name:'太白粉',unit:'g',base:5},{name:'沙拉油',unit:'cc',base:15},{name:'鹽',unit:'g',base:2}],
      steps:['豬肉絲加醬油、米酒、太白粉醃 10 分鐘。','起鍋熱油，先爆香薑絲至微焦香。','放入醃好的肉絲，大火快炒至變色。','加鹽調味，翻炒均勻即可起鍋。']},
    { id:'spinach', name:'蒜炒菠菜', tag:'蔬菜', tagClass:'tag-veg', time:'約 10 分鐘',

      steps:['菠菜洗淨切段，備用。','起鍋熱油，爆香蒜末至微黃。','放入菠菜大火翻炒約 2 分鐘。','加鹽調味，快速翻炒後起鍋。']},
    { id:'egg_tomato', name:'番茄炒蛋', tag:'蛋類', tagClass:'tag-egg', time:'約 15 分鐘',
      ingredients:[{name:'雞蛋',unit:'顆',base:3,noScale:true},{name:'番茄',unit:'g',base:250},{name:'糖',unit:'g',base:5},{name:'鹽',unit:'g',base:3},{name:'沙拉油',unit:'cc',base:20}],
      steps:['雞蛋打散加少許鹽，番茄切塊。','熱鍋下油，炒蛋至半熟後盛起。','同鍋再加油，放番茄炒出湯汁。','加糖、鹽，倒回蛋翻炒均勻。']},

  ]},
  { day:'週二', dishes:[
    { id:'onion_pork', name:'洋蔥炒豬排', tag:'肉類', tagClass:'tag-meat', time:'約 20 分鐘',
      ingredients:[{name:'薄切豬排',unit:'g',base:300},{name:'洋蔥',unit:'g',base:150},{name:'醬油',unit:'cc',base:20},{name:'味醂',unit:'cc',base:10},{name:'糖',unit:'g',base:5},{name:'沙拉油',unit:'cc',base:15}],

  ]},
  { day:'週三', dishes:[
    { id:'three_cup', name:'三杯雞', tag:'肉類', tagClass:'tag-meat', time:'約 25 分鐘',
      ingredients:[{name:'雞腿肉',unit:'g',base:400},{name:'九層塔',unit:'g',base:15},{name:'薑片',unit:'g',base:15},{name:'蒜頭',unit:'g',base:20},{name:'醬油',unit:'cc',base:30},{name:'米酒',unit:'cc',base:30},{name:'麻油',unit:'cc',base:20},{name:'糖',unit:'g',base:10}],
      steps:['雞腿肉切塊，麻油入鍋爆香薑片至微焦。','加蒜頭炒香，放雞肉大火翻炒至表面上色。','加醬油、米酒、糖，蓋鍋小火燜煮 10 分鐘。','開大火收汁，起鍋前放九層塔翻炒均勻。']},
    { id:'hollow_veg', name:'清炒空心菜', tag:'蔬菜', tagClass:'tag-veg', time:'約 10 分鐘',

let currentDayIdx = 0;
let activeDishId = null;
let customDishes = {};

function renderDays() {
  document.getElementById('dayStrip').innerHTML = MENUS.map((m,i) =>
    `<button class="day-btn${i===currentDayIdx?' active':''}" onclick="setDay(${i})">${m.day}</button>`
  ).join('');
}

function setDay(idx) {
  currentDayIdx = idx;
  activeDishId = null;
  document.getElementById('customPanel').className = 'custom-input-panel';
  document.getElementById('detailPanel').className = 'detail-panel';
  renderDays();
  renderMenu();
}

function getEffectiveDishes() {
  return MENUS[currentDayIdx].dishes.map((d,i) => customDishes[`${currentDayIdx}_${i}`] || d);
}

function renderMenu() {
  const dishes = getEffectiveDishes();
  document.getElementById('menuGrid').innerHTML = dishes.map((d,i) => {
    const key = `${currentDayIdx}_${i}`;
    const isCustom = !!customDishes[key];
    const isActive = activeDishId === d.id;
    return `
      <div class="dish-card${isActive?' active':''}${isCustom?' has-custom custom-card':''}" onclick="showDish('${d.id}',${i})">
        <div class="dish-tag ${d.tagClass}">${d.tag}</div>
        <div class="dish-name">${d.name}</div>
        <div class="dish-time">${d.time}</div>
        <span class="edit-badge" onclick="openCustom(event,${i})">${isCustom?'修改':'自訂'}</span>
      </div>`;
  }).join('');
  renderShopping();
  document.getElementById('footerNote').style.display = 'block';
}

function openCustom(e, slotIdx) {
  e.stopPropagation();
  activeDishId = null;
  document.getElementById('detailPanel').className = 'detail-panel';
  const key = `${currentDayIdx}_${slotIdx}`;
  const existing = customDishes[key];
  const panel = document.getElementById('customPanel');
  panel.innerHTML = `
    <div class="panel-label">自訂「${SLOT_LABELS[slotIdx]}」<span>輸入菜名，由 AI 生成食譜</span></div>
    <div class="input-row">
      <input id="nameInput" type="text" placeholder="例如：蒜泥白肉、菜脯蛋…"
        value="${existing?existing.name:''}" onkeydown="if(event.key==='Enter')doGenerate(${slotIdx})"/>
      <button class="generate-btn" id="genBtn" onclick="doGenerate(${slotIdx})">
        <div class="spinner" id="genSpinner"></div>
        <span id="genTxt">生成</span>
      </button>
    </div>
    <div class="error-msg" id="genErr"></div>
    ${existing?`<div class="clear-link">目前：<strong>${existing.name}</strong>　<a onclick="clearCustom(${slotIdx})">恢復預設</a></div>`:''}
  `;
  panel.className = 'custom-input-panel show';
  setTimeout(()=>{ const el=document.getElementById('nameInput'); if(el) el.focus(); },100);
}

function clearCustom(slotIdx) {
  delete customDishes[`${currentDayIdx}_${slotIdx}`];
  document.getElementById('customPanel').className='custom-input-panel';
  activeDishId=null;
  document.getElementById('detailPanel').className='detail-panel';
  renderMenu();
}

async function doGenerate(slotIdx) {
  const name = (document.getElementById('nameInput').value||'').trim();
  if (!name) { document.getElementById('nameInput').focus(); return; }
  const btn=document.getElementById('genBtn');
  const sp=document.getElementById('genSpinner');
  const txt=document.getElementById('genTxt');
  const err=document.getElementById('genErr');
  btn.disabled=true; sp.className='spinner show'; txt.textContent='生成中…'; err.className='error-msg';

  const prompt = `你是台灣家庭料理專家。請為「${name}」生成一份適合一家五口（3個成人份）的食譜，只回傳 JSON，格式如下：
{"name":"${name}","tag":"${SLOT_TAG_NAMES[slotIdx]}","time":"約 X 分鐘","ingredients":[{"name":"食材","unit":"g或cc或顆","amount":數字}],"steps":["步驟1","步驟2","步驟3","步驟4"]}
規則：台灣菜市場容易買到的食材，備餐加烹飪在60分鐘內，份量已是3人份。`;

  try {
    const res = await fetch('https://dinner.pon76124.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    const raw = data.content.map(c=>c.text||'').join('').trim().replace(/```json|```/g,'').trim();
    const r = JSON.parse(raw);
    const tagMap={'肉類':'tag-meat','蔬菜':'tag-veg','蛋類':'tag-egg','湯品':'tag-soup'};
    const dish = {
      id:`custom_${currentDayIdx}_${slotIdx}_${Date.now()}`,
      name:r.name, tag:r.tag||SLOT_TAG_NAMES[slotIdx],
      tagClass:tagMap[r.tag]||SLOT_TAGS[slotIdx],
      time:r.time||'約 20 分鐘',
      ingredients:r.ingredients.map(i=>({name:i.name,unit:i.unit,base:i.amount,noScale:true})),
      steps:r.steps, isAI:true
    };
    customDishes[`${currentDayIdx}_${slotIdx}`] = dish;
    document.getElementById('customPanel').className='custom-input-panel';
    activeDishId = dish.id;
    renderMenu();
    renderDetail(dish);
  } catch(e) {
    err.textContent='生成失敗，請再試一次。（'+e.message+'）';
    err.className='error-msg show';
  } finally {
    btn.disabled=false; sp.className='spinner'; txt.textContent='生成';
  }
}

function showDish(dishId, slotIdx) {
  document.getElementById('customPanel').className='custom-input-panel';
  if (activeDishId === dishId) {
    activeDishId=null;
    document.getElementById('detailPanel').className='detail-panel';
    renderMenu(); return;
  }
  activeDishId = dishId;
  const dish = getEffectiveDishes()[slotIdx];
  renderMenu();
  renderDetail(dish);
  setTimeout(()=>document.getElementById('detailPanel').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function renderDetail(dish) {
  const panel = document.getElementById('detailPanel');
  if (!dish) { panel.className='detail-panel'; return; }
  const ings = dish.ingredients.map(ing=>{
    const amt = ing.noScale ? ing.base : Math.round(ing.base*SCALE);
    return `<div class="ing-row"><span class="ing-name">${ing.name}</span><span class="ing-amt">${amt} ${ing.unit}</span></div>`;
  }).join('');
  const steps = dish.steps.map((s,i)=>
    `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`
  ).join('');
  const aiBadge = dish.isAI ? `<span class="ai-badge">AI 生成</span>` : '';
  panel.className='detail-panel show';
  panel.innerHTML=`
    <div class="detail-header">
      <span class="detail-title">${dish.name}</span>
      ${aiBadge}
      <span class="detail-time">${dish.time}</span>
    </div>
    <div class="section-label">備料清單（5 人份）</div>
    ${ings}
    <div class="section-label steps-label">烹飪步驟</div>
    <ul class="steps-list">${steps}</ul>`;
}

function renderShopping() {
  const card = document.getElementById('shoppingCard');
  const allIng = {};
  getEffectiveDishes().forEach(dish => {
    dish.ingredients.forEach(ing => {
      const amt = ing.noScale ? ing.base : Math.round(ing.base*SCALE);
      if (allIng[ing.name]) { if (!ing.noScale) allIng[ing.name].amt += amt; }
      else allIng[ing.name] = { amt, unit: ing.unit };
    });
  });
  card.style.display='block';
  card.innerHTML=`
    <div class="shopping-title">今日採買清單</div>
    <div class="shopping-grid">
      ${Object.entries(allIng).map(([n,v])=>`<div class="shop-item"><span>${n}</span><span>${v.amt} ${v.unit}</span></div>`).join('')}
    </div>`;
}

renderDays();
renderMenu();
</script>
